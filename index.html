<body class="text-gray-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ✅ Firestore 참조
        const db = window.db;
        const SUBMISSIONS_COL = 'submissions';
        const SETTINGS_DOC = db.collection('settings').doc('teacher');

        // 해남군 지역 문제 주제 목록
        const TOPICS = [
            { id: 'demographics', name: '인구 감소 및 아동 수 감소', icon: 'fa-users-slash', color: 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100', badge: 'bg-rose-500' },
            { id: 'traffic', name: '교통 안전 (스쿨존·안전길)', icon: 'fa-bus-school', color: 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100', badge: 'bg-amber-500' },
            { id: 'environment', name: '생활 환경 (쓰레기·공원·깨끗한 거리)', icon: 'fa-recycle', color: 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100', badge: 'bg-emerald-500' },
            { id: 'community', name: '이웃과 마을 (어르신·놀이공간)', icon: 'fa-hand-holding-heart', color: 'bg-sky-50 text-sky-700 border-sky-200 hover:bg-sky-100', badge: 'bg-sky-500' },
            { id: 'economy', name: '지역 축제 및 경제 (특산물·시장)', icon: 'fa-store', color: 'bg-purple-50 text-purple-700 border-purple-200 hover:bg-purple-100', badge: 'bg-purple-500' },
            { id: 'healthcare', name: '보건 의료 및 안전 (병원·응급)', icon: 'fa-hospital-user', color: 'bg-teal-50 text-teal-700 border-teal-200 hover:bg-teal-100', badge: 'bg-teal-500' }
        ];

        // 시민단체 역할 목록
        const ROLES = [
            { id: 'design', name: '디자인 제작', desc: '포스터, 피켓, 홍보물 그림 그리기 및 꾸미기', icon: 'fa-palette', color: 'text-pink-600 bg-pink-100 border-pink-300' },
            { id: 'writing', name: '글쓰기 기획', desc: '성명서, 건의문, 신문 기사 내용 작성하기', icon: 'fa-pen-nib', color: 'text-indigo-600 bg-indigo-100 border-indigo-300' },
            { id: 'research', name: '자료 조사', desc: '인터넷 검색, 사진 촬영, 알맞은 인터뷰 조사', icon: 'fa-magnifying-glass', color: 'text-cyan-600 bg-cyan-100 border-cyan-300' },
            { id: 'presentation', name: '발표 담당', desc: '우리 모둠의 의견을 학급 친구들 앞에서 발표하기', icon: 'fa-bullhorn', color: 'text-amber-600 bg-amber-100 border-amber-300' },
            { id: 'coordination', name: '조율·정리 담당', desc: '활동 순서 정리, 시간 확인, 모둠원 잘 다독이기', icon: 'fa-clipboard-check', color: 'text-emerald-600 bg-emerald-100 border-emerald-300' }
        ];

        // 샘플 학생 데이터 (시연용)
        const SAMPLE_STUDENTS = [
            { name: '김해남', topic: 'traffic', detail: '학교 앞 어린이 보호구역에 방지턱과 신호등이 더 필요해요.', role: 'presentation', timestamp: '10:01' },
            { name: '이땅끝', topic: 'traffic', detail: '학원 버스 내리는 곳이 위험해서 안내 표지판을 만들고 싶어요.', role: 'design', timestamp: '10:02' },
            { name: '박고구마', topic: 'traffic', detail: '자전거 타는 친구들이 안전모를 쓸 수 있게 캠페인을 해요.', role: 'writing', timestamp: '10:03' },
            { name: '최공룡', topic: 'traffic', detail: '스쿨존 위반 차량 신고 및 단속 건의문을 쓰고 싶어요.', role: 'research', timestamp: '10:05' },
            { name: '정우수', topic: 'environment', detail: '마을 천변에 버려진 플라스틱 쓰레기를 줍고 안내판을 세워요.', role: 'design', timestamp: '10:06' },
            { name: '강바다', topic: 'environment', detail: '분리수거 방법을 쉬운 그림으로 만들어 홍보하고 싶어요.', role: 'coordination', timestamp: '10:08' },
            { name: '윤하늘', topic: 'environment', detail: '공원에 꽃밭을 가꾸고 환경 지킴이 지도 만들기.', role: 'research', timestamp: '10:09' },
            { name: '장들판', topic: 'environment', detail: '일회용품 줄이기 운동 가이드북 제작하기.', role: 'writing', timestamp: '10:10' },
            { name: '임태양', topic: 'demographics', detail: '해남에 아이들이 놀 수 있는 실내 놀이터 건의하기.', role: 'presentation', timestamp: '10:12' },
            { name: '한소송', topic: 'demographics', detail: '젊은 부모님들이 살기 좋은 우리 동네 자랑 카드 뉴스 만들기.', role: 'design', timestamp: '10:13' },
            { name: '오세찬', topic: 'demographics', detail: '다른 지역 친구들에게 해남을 홍보하는 영상 기획서 쓰기.', role: 'writing', timestamp: '10:15' },
            { name: '서유리', topic: 'demographics', detail: '아이들이 필요한 시설 설문조사 진행하기.', role: 'research', timestamp: '10:16' },
            { name: '신다정', topic: 'community', detail: '마을 경로당 어르신들께 옛날 이야기 듣고 자서전 써드리기.', role: 'writing', timestamp: '10:18' },
            { name: '권민준', topic: 'community', detail: '어르신들이 길 건너기 편하도록 쉼터 의자 설치 건의.', role: 'coordination', timestamp: '10:19' },
            { name: '황지아', topic: 'community', detail: '마을 축제에서 어르신과 함께하는 놀이 부스 운영.', role: 'presentation', timestamp: '10:20' },
            { name: '송현우', topic: 'economy', detail: '해남 특산물 고구마와 배추를 홍보하는 캐릭터 그리기.', role: 'design', timestamp: '10:22' },
            { name: '류은지', topic: 'economy', detail: '전통시장에 젊은 손님이 많이 오도록 지도 만들기.', role: 'research', timestamp: '10:23' },
            { name: '문성진', topic: 'economy', detail: '해남 어린이 특산물 홍보 대사 포스터 제작.', role: 'presentation', timestamp: '10:25' },
            { name: '배서연', topic: 'healthcare', detail: '응급처치 방법을 알리는 가이드 카드 만들기.', role: 'design', timestamp: '10:27' },
            { name: '조원준', topic: 'healthcare', detail: '주말에도 이용할 수 있는 병원 약국 정보 지도를 꾸미기.', role: 'coordination', timestamp: '10:28' }
        ];

        function App() {
            const [mode, setMode] = useState('student');

            // 학생 입력 Form State
            const [studentName, setStudentName] = useState('');
            const [selectedTopic, setSelectedTopic] = useState('');
            const [topicDetail, setTopicDetail] = useState('');
            const [selectedRole, setSelectedRole] = useState('');
            const [isSubmitted, setIsSubmitted] = useState(false);

            // 교사 관리 State
            const [submissions, setSubmissions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [teacherPassword, setTeacherPassword] = useState('');
            const [storedPassword, setStoredPassword] = useState('1234');
            const [isTeacherAuthenticated, setIsTeacherAuthenticated] = useState(false);
            const [groupSize, setGroupSize] = useState(4);
            const [generatedGroups, setGeneratedGroups] = useState(null);
            const [teacherTab, setTeacherTab] = useState('overview');
            const [showPwModal, setShowPwModal] = useState(false);
            const [newPwInput, setNewPwInput] = useState('');
            const [migrationStatus, setMigrationStatus] = useState(''); // 마이그레이션 상태 메시지

            // ✅ Firestore 실시간 구독 - submissions
            useEffect(() => {
                const unsub = db.collection(SUBMISSIONS_COL)
                    .orderBy('createdAt', 'asc')
                    .onSnapshot(
                        (snap) => {
                            const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                            setSubmissions(list);
                            setLoading(false);
                        },
                        (err) => {
                            console.error('Firestore 구독 오류:', err);
                            setLoading(false);
                        }
                    );
                return () => unsub();
            }, []);

            // ✅ Firestore 실시간 구독 - 교사 비밀번호
            useEffect(() => {
                const unsub = SETTINGS_DOC.onSnapshot((doc) => {
                    if (doc.exists && doc.data().password) {
                        setStoredPassword(doc.data().password);
                    }
                });
                return () => unsub();
            }, []);

            // 비밀번호 변경 저장 → Firestore
            const handleChangePassword = async (e) => {
                e.preventDefault();
                if (!newPwInput.trim()) {
                    alert('새 비밀번호를 입력해주세요.');
                    return;
                }
                try {
                    await SETTINGS_DOC.set({ password: newPwInput.trim() }, { merge: true });
                    setNewPwInput('');
                    setShowPwModal(false);
                    alert('교사 비밀번호가 성공적으로 변경되었습니다!');
                } catch (err) {
                    console.error(err);
                    alert('비밀번호 저장 중 오류가 발생했습니다: ' + err.message);
                }
            };

            // 학생 설문 제출 → Firestore addDoc
            const handleSubmitStudent = async (e) => {
                e.preventDefault();
                if (!studentName.trim() || !selectedTopic || !topicDetail.trim() || !selectedRole) {
                    alert('모든 질문 항목에 답변을 작성해주세요!');
                    return;
                }
                const newEntry = {
                    name: studentName.trim(),
                    topic: selectedTopic,
                    detail: topicDetail.trim(),
                    role: selectedRole,
                    timestamp: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                try {
                    await db.collection(SUBMISSIONS_COL).add(newEntry);
                    setIsSubmitted(true);
                } catch (err) {
                    console.error(err);
                    alert('제출 중 오류가 발생했습니다: ' + err.message);
                }
            };

            const handleResetForm = () => {
                setStudentName('');
                setSelectedTopic('');
                setTopicDetail('');
                setSelectedRole('');
                setIsSubmitted(false);
            };

            const handleTeacherAuth = (e) => {
                e.preventDefault();
                if (teacherPassword === storedPassword) {
                    setIsTeacherAuthenticated(true);
                } else {
                    alert('비밀번호가 올바르지 않습니다.');
                }
            };

            // 샘플 데이터 → Firestore 배치 추가
            const handleLoadSampleData = async () => {
                if (!confirm('시연용 학생 20명의 응답 데이터를 로드하시겠습니까? (기존 응답에 추가됩니다)')) return;
                try {
                    const batch = db.batch();
                    SAMPLE_STUDENTS.forEach(s => {
                        const ref = db.collection(SUBMISSIONS_COL).doc();
                        batch.set(ref, {
                            ...s,
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    await batch.commit();
                } catch (err) {
                    console.error(err);
                    alert('샘플 데이터 추가 중 오류: ' + err.message);
                }
            };

            // 전체 삭제 → Firestore 배치 삭제
            const handleClearData = async () => {
                if (!confirm('정말로 모든 학생 응답 데이터를 초기화하시겠습니까?')) return;
                try {
                    const snap = await db.collection(SUBMISSIONS_COL).get();
                    const batch = db.batch();
                    snap.docs.forEach(d => batch.delete(d.ref));
                    await batch.commit();
                    setGeneratedGroups(null);
                } catch (err) {
                    console.error(err);
                    alert('삭제 중 오류: ' + err.message);
                }
            };

            // ✅ localStorage → Firestore 마이그레이션
            const handleMigrateFromLocalStorage = async () => {
                try {
                    setMigrationStatus('🔎 localStorage 데이터 확인 중...');
                    const rawSubs = localStorage.getItem('haenam_submissions');
                    const rawPw = localStorage.getItem('haenam_teacher_password');

                    const localSubs = rawSubs ? JSON.parse(rawSubs) : [];
                    const localPw = rawPw || null;

                    if (localSubs.length === 0 && !localPw) {
                        setMigrationStatus('');
                        alert('이전할 localStorage 데이터가 없습니다.');
                        return;
                    }

                    const ok = confirm(
                        `localStorage에서 다음 데이터를 Firestore로 이전합니다.\n\n` +
                        `• 학생 응답: ${localSubs.length}건\n` +
                        `• 교사 비밀번호: ${localPw ? '있음' : '없음'}\n\n` +
                        `계속 진행할까요? (기존 Firestore 데이터는 그대로 유지되며, 이 응답들이 추가됩니다)`
                    );
                    if (!ok) {
                        setMigrationStatus('');
                        return;
                    }

                    // 응답 데이터 배치 업로드 (500건 단위)
                    if (localSubs.length > 0) {
                        setMigrationStatus(`⏫ ${localSubs.length}건의 응답 업로드 중...`);
                        const CHUNK = 400;
                        for (let i = 0; i < localSubs.length; i += CHUNK) {
                            const chunk = localSubs.slice(i, i + CHUNK);
                            const batch = db.batch();
                            chunk.forEach(sub => {
                                const ref = db.collection(SUBMISSIONS_COL).doc();
                                const { id, ...rest } = sub; // 기존 id는 Firestore가 새로 발급
                                batch.set(ref, {
                                    ...rest,
                                    migratedFromLocal: true,
                                    legacyId: id || null,
                                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                                });
                            });
                            await batch.commit();
                        }
                    }

                    // 비밀번호 이전
                    if (localPw) {
                        setMigrationStatus('🔐 교사 비밀번호 저장 중...');
                        await SETTINGS_DOC.set({ password: localPw }, { merge: true });
                    }

                    // 성공 후 localStorage 정리 여부 묻기
                    const clearLocal = confirm(
                        '✅ 이전이 완료되었습니다!\n\n' +
                        '중복 저장을 막기 위해 localStorage에 남아있는 데이터를 삭제할까요?\n' +
                        '(권장: 예)'
                    );
                    if (clearLocal) {
                        localStorage.removeItem('haenam_submissions');
                        localStorage.removeItem('haenam_teacher_password');
                    }
                    setMigrationStatus('✅ 마이그레이션 완료!');
                    setTimeout(() => setMigrationStatus(''), 4000);
                } catch (err) {
                    console.error(err);
                    setMigrationStatus('');
                    alert('마이그레이션 중 오류가 발생했습니다: ' + err.message);
                }
            };

            // 지능형 모둠 구성 알고리즘 (기존 로직 유지)
            const generateSmartGroups = () => {
                if (submissions.length === 0) {
                    alert('제출된 학생 응답이 없어 모둠을 구성할 수 없습니다.');
                    return;
                }
                const topicBuckets = {};
                TOPICS.forEach(t => topicBuckets[t.id] = []);
                submissions.forEach(sub => {
                    if (topicBuckets[sub.topic]) topicBuckets[sub.topic].push(sub);
                });

                const allGroups = [];
                let groupCounter = 1;

                Object.keys(topicBuckets).forEach(topicId => {
                    const studentsInTopic = [...topicBuckets[topicId]];
                    if (studentsInTopic.length === 0) return;
                    const topicObj = TOPICS.find(t => t.id === topicId);

                    while (studentsInTopic.length > 0) {
                        let currentTargetSize = Math.min(groupSize, studentsInTopic.length);
                        if (studentsInTopic.length > groupSize && studentsInTopic.length < groupSize * 2) {
                            currentTargetSize = Math.ceil(studentsInTopic.length / 2);
                        }
                        const currentGroupMembers = [];
                        const usedRoles = new Set();

                        for (let i = 0; i < currentTargetSize; i++) {
                            let bestIndex = studentsInTopic.findIndex(s => !usedRoles.has(s.role));
                            if (bestIndex === -1) bestIndex = 0;
                            const selectedStudent = studentsInTopic.splice(bestIndex, 1)[0];
                            currentGroupMembers.push(selectedStudent);
                            usedRoles.add(selectedStudent.role);
                        }

                        const uniqueRoleCount = new Set(currentGroupMembers.map(m => m.role)).size;
                        const balanceScore = Math.round((uniqueRoleCount / Math.min(5, currentGroupMembers.length)) * 100);

                        allGroups.push({
                            id: `group_${groupCounter}`,
                            groupNumber: groupCounter,
                            topicId: topicId,
                            topicName: topicObj ? topicObj.name : '지역 문제',
                            topicColor: topicObj ? topicObj.color : '',
                            topicBadge: topicObj ? topicObj.badge : 'bg-emerald-500',
                            members: currentGroupMembers,
                            balanceScore: balanceScore
                        });
                        groupCounter++;
                    }
                });

                setGeneratedGroups(allGroups);
                setTeacherTab('groups');
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* 상단 헤더 */}
                    <header className="bg-emerald-600 text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-y-2">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                                    <i className="fa-solid fa-people-roof text-2xl text-yellow-300"></i>
                                </div>
                                <div>
                                    <h1 className="text-xl md:text-2xl font-bold font-title tracking-wide">
                                        해남 어린이 시민단체 모둠 구성
                                    </h1>
                                    <p className="text-xs text-emerald-100 hidden sm:block">
                                        <i className="fa-solid fa-cloud mr-1"></i>
                                        Firestore 실시간 연동 - 어디서든 함께 참여해요!
                                    </p>
                                </div>
                            </div>

                            <div className="flex items-center bg-emerald-700/60 p-1 rounded-xl border border-emerald-500/30 text-sm">
                                <button
                                    onClick={() => setMode('student')}
                                    className={`px-3 py-1.5 rounded-lg font-medium transition-all flex items-center space-x-1.5 ${
                                        mode === 'student' ? 'bg-white text-emerald-800 shadow' : 'text-emerald-100 hover:text-white'
                                    }`}
                                >
                                    <i className="fa-solid fa-pen-to-square"></i>

            const {
                loading,
                isTeacherAuthenticated, teacherPassword, setTeacherPassword, handleTeacherAuth,

                handleMigrateFromLocalStorage, migrationStatus,
                groupSize, setGroupSize, generateSmartGroups,

                            <input

            // 통계
            const topicCounts = TOPICS.map(t => ({

                                            </div>
                                            <ul className="space-y-1.5">
                                                {g.members.map(m => {
                                                    const role = ROLES.find(r => r.id === m.role);
                                                    return (
                                                        <li key={m.id} className="flex items-center justify-between text-sm">
                                                            <span className="font-medium">{m.name}</span>
                                                            <span className={`text-xs px-2 py-0.5 rounded border ${role?.color}`}>
                                                                <i className={`fa-solid ${role?.icon} mr-1`}></i>{role?.name}
                                                            </span>
                                                        </li>
                                                    );
                                                })}
                                            </ul>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* 비밀번호 변경 모달 */}
                    {showPwModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
                                <h3 className="font-bold text-lg mb-3">교사 비밀번호 변경</h3>
                                <form onSubmit={handleChangePassword} className="space-y-3">
                                    <input type="text" value={newPwInput}
                                        onChange={(e) => setNewPwInput(e.target.value)}
                                        placeholder="새 비밀번호"
                                        className="w-full px-4 py-2.5 border border-gray-300 rounded-xl" />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowPwModal(false)}
                                            className="flex-1 py-2.5 bg-gray-200 hover:bg-gray-300 rounded-xl font-bold text-sm">취소</button>
                                        <button type="submit"
                                            className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm">저장</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
